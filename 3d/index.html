<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escritório Cremon Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --creme: #F6F1E8; --tinta: #151413; --laranja: #FF5A36; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #EDE5D8; font-family: Inter, system-ui, sans-serif; color: var(--tinta); }
  #palco { position: fixed; inset: 0; }
  #rotulos { position: fixed; inset: 0; pointer-events: none; }
  .marca { position: fixed; top: 18px; left: 22px; font-weight: 800; font-size: 22px; letter-spacing: -0.045em; z-index: 3; user-select: none; }
  .marca span { color: var(--laranja); }
  .marca small { display: block; font-weight: 600; font-size: 11px; letter-spacing: 0; opacity: .55; margin-top: 2px; }
  .ajuda { position: fixed; top: 20px; right: 22px; font-size: 12px; font-weight: 600; background: rgba(246,241,232,.9); border: 1.5px solid var(--tinta); border-radius: 999px; padding: 7px 14px; z-index: 3; }
  #dica { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: var(--tinta); color: var(--creme); font-weight: 600; font-size: 14px; padding: 10px 18px; border-radius: 999px; opacity: 0; transition: opacity .2s; z-index: 3; white-space: nowrap; }
  #dica.on { opacity: 1; }
  #dica kbd { font: 700 12px Inter, sans-serif; background: var(--laranja); color: var(--tinta); border-radius: 6px; padding: 2px 7px; margin-right: 6px; }
  .nome { font-weight: 700; font-size: 11px; color: var(--creme); background: rgba(21,20,19,.78); padding: 2px 8px; border-radius: 999px; white-space: nowrap; transform: translateY(-6px); }
  .nome.voce { background: var(--laranja); color: var(--tinta); }
  .fala { position: relative; max-width: 230px; width: max-content; background: #FFFBF4; border: 2px solid var(--tinta); border-radius: 14px; padding: 7px 11px 8px; font-weight: 600; font-size: 13px; line-height: 1.3; box-shadow: 0 3px 0 rgba(21,20,19,.22); transform: translateY(-14px); animation: entra .2s cubic-bezier(.2,1.4,.4,1); }
  .fala b { display: block; color: var(--laranja); font-size: 11px; margin-bottom: 1px; }
  .fala::after { content: ""; position: absolute; left: 50%; bottom: -9px; margin-left: -8px; border: 8px solid transparent; border-top-color: var(--tinta); border-bottom: 0; }
  .placa { font-weight: 700; font-size: 13px; color: var(--creme); background: var(--tinta); padding: 6px 12px; border-radius: 8px; white-space: nowrap; box-shadow: 0 3px 0 rgba(21,20,19,.18); }
  .placa::before { content: "✱ "; color: var(--laranja); }
  .pa { font-weight: 800; font-size: 26px; color: var(--tinta); background: #FFD23F; border: 3px solid var(--laranja); padding: 10px 16px; clip-path: polygon(50% 0, 61% 18%, 82% 6%, 78% 30%, 100% 34%, 84% 52%, 100% 70%, 76% 72%, 80% 96%, 60% 84%, 50% 100%, 40% 84%, 20% 96%, 24% 72%, 0 70%, 16% 52%, 0 34%, 22% 30%, 18% 6%, 39% 18%); animation: entra .15s ease-out; }
  #dica { bottom: 118px; }
  .reacao { font-size: 30px; animation: sobe 1.7s ease-out forwards; filter: drop-shadow(0 2px 0 rgba(21,20,19,.25)); }
  @keyframes sobe { 0% { transform: translateY(0) scale(.4); opacity: 0; } 15% { transform: translateY(-10px) scale(1.15); opacity: 1; } 100% { transform: translateY(-70px) scale(1); opacity: 0; } }
  .barra { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 4; display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .barra .acoes, .barra .reacoes { display: flex; gap: 4px; background: rgba(246,241,232,.94); border: 1.5px solid var(--tinta); border-radius: 14px; padding: 5px; box-shadow: 0 3px 0 rgba(21,20,19,.15); }
  .barra button { font: 600 12px Inter, sans-serif; color: var(--tinta); background: transparent; border: 0; border-radius: 9px; padding: 6px 8px; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 5px; }
  .barra button:hover { background: var(--tinta); color: var(--creme); }
  .barra button kbd { font: 700 10px Inter, sans-serif; background: var(--laranja); color: var(--tinta); border-radius: 5px; padding: 1px 5px; }
  .barra .reacoes button { font-size: 19px; padding: 3px 7px; }
  @media (max-width: 900px) { .barra .acoes button { font-size: 0; gap: 0; } .barra .acoes button kbd { font-size: 10px; } }
  @keyframes entra { from { transform: translateY(-4px) scale(.6); opacity: 0; } }
  @media (max-width: 640px) { .ajuda { display: none; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div class="marca">CREM<span>✱</span>N<small>escritório</small></div>
<div class="ajuda">WASD ou clique para andar · E interage · F senta · roda do mouse aproxima</div>
<div id="palco"></div>
<div id="dica"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
