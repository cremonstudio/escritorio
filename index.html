<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escritório Cremon Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --creme: #F6F1E8; --tinta: #151413; --laranja: #FF5A36; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #EDE5D8; font-family: Inter, system-ui, sans-serif; color: var(--tinta); }
  #palco { position: fixed; inset: 0; }
  #rotulos { position: fixed; inset: 0; pointer-events: none; }
  .marca { position: fixed; top: 18px; left: 22px; font-weight: 800; font-size: 22px; letter-spacing: -0.045em; z-index: 3; user-select: none; }
  .marca span { color: var(--laranja); }
  .marca small { display: block; font-weight: 600; font-size: 11px; letter-spacing: 0; opacity: .55; margin-top: 2px; }
  .ajuda { position: fixed; top: 20px; right: 22px; font-size: 12px; font-weight: 600; background: rgba(246,241,232,.9); border: 1.5px solid var(--tinta); border-radius: 999px; padding: 7px 14px; z-index: 3; }
  #dica { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: var(--tinta); color: var(--creme); font-weight: 600; font-size: 14px; padding: 10px 18px; border-radius: 999px; opacity: 0; transition: opacity .2s; z-index: 3; white-space: nowrap; }
  #dica.on { opacity: 1; }
  #dica kbd { font: 700 12px Inter, sans-serif; background: var(--laranja); color: var(--tinta); border-radius: 6px; padding: 2px 7px; margin-right: 6px; }
  .nome { font-weight: 700; font-size: 11px; color: var(--creme); background: rgba(21,20,19,.78); padding: 2px 8px; border-radius: 999px; white-space: nowrap; transform: translateY(-6px); }
  .nome.voce { background: var(--laranja); color: var(--tinta); }
  .fala { position: relative; max-width: 230px; width: max-content; background: #FFFBF4; border: 2px solid var(--tinta); border-radius: 14px; padding: 7px 11px 8px; font-weight: 600; font-size: 13px; line-height: 1.3; box-shadow: 0 3px 0 rgba(21,20,19,.22); transform: translateY(-14px); animation: entra .2s cubic-bezier(.2,1.4,.4,1); }
  .fala b { display: block; color: var(--laranja); font-size: 11px; margin-bottom: 1px; }
  .fala::after { content: ""; position: absolute; left: 50%; bottom: -9px; margin-left: -8px; border: 8px solid transparent; border-top-color: var(--tinta); border-bottom: 0; }
  .placa { font-weight: 700; font-size: 13px; color: var(--creme); background: var(--tinta); padding: 6px 12px; border-radius: 8px; white-space: nowrap; box-shadow: 0 3px 0 rgba(21,20,19,.18); }
  .placa::before { content: "✱ "; color: var(--laranja); }
  .pa { font-weight: 800; font-size: 26px; color: var(--tinta); background: #FFD23F; border: 3px solid var(--laranja); padding: 10px 16px; clip-path: polygon(50% 0, 61% 18%, 82% 6%, 78% 30%, 100% 34%, 84% 52%, 100% 70%, 76% 72%, 80% 96%, 60% 84%, 50% 100%, 40% 84%, 20% 96%, 24% 72%, 0 70%, 16% 52%, 0 34%, 22% 30%, 18% 6%, 39% 18%); animation: entra .15s ease-out; }
  #dica { bottom: 118px; }
  .reacao { font-size: 30px; animation: sobe 1.7s ease-out forwards; filter: drop-shadow(0 2px 0 rgba(21,20,19,.25)); }
  @keyframes sobe { 0% { transform: translateY(0) scale(.4); opacity: 0; } 15% { transform: translateY(-10px) scale(1.15); opacity: 1; } 100% { transform: translateY(-70px) scale(1); opacity: 0; } }
  .barra { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 4; display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .barra .acoes, .barra .reacoes { display: flex; gap: 4px; background: rgba(246,241,232,.94); border: 1.5px solid var(--tinta); border-radius: 14px; padding: 5px; box-shadow: 0 3px 0 rgba(21,20,19,.15); }
  .barra button { font: 600 12px Inter, sans-serif; color: var(--tinta); background: transparent; border: 0; border-radius: 9px; padding: 6px 8px; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 5px; }
  .barra button:hover { background: var(--tinta); color: var(--creme); }
  .barra button kbd { font: 700 10px Inter, sans-serif; background: var(--laranja); color: var(--tinta); border-radius: 5px; padding: 1px 5px; }
  .barra .reacoes button { font-size: 19px; padding: 3px 7px; }
  @media (max-width: 900px) { .barra .acoes button { font-size: 0; gap: 0; } .barra .acoes button kbd { font-size: 10px; } }
  .nome.membro::before { content: "✱ "; color: var(--laranja); }
  .nome.voce.membro::before { color: var(--tinta); }
  .batida { position: fixed; top: 22px; left: 50%; transform: translateX(-50%); z-index: 6; background: var(--creme); border: 2px solid var(--tinta); border-radius: 16px; padding: 14px 18px; font-weight: 600; font-size: 14px; box-shadow: 0 4px 0 rgba(21,20,19,.2); text-align: center; }
  .batida div { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
  .batida button { font: 700 13px Inter, sans-serif; border: 2px solid var(--tinta); border-radius: 999px; padding: 7px 14px; cursor: pointer; background: transparent; }
  .batida button[data-sim] { background: var(--tinta); color: var(--creme); }
  .entrada .erro { color: #C0392B; font-size: 13px; font-weight: 600; min-height: 18px; margin: -6px 0 10px; }
  .entrada .ou { display: block; width: 100%; margin-top: 12px; font: 600 13px Inter, sans-serif; background: none; border: 0; color: var(--tinta); text-decoration: underline; cursor: pointer; }
  .entrada .nota { font-size: 13px; opacity: .65; margin: -6px 0 14px; }
  .entrada [hidden] { display: none !important; }
  .chatbot { position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 100vw); z-index: 7; background: var(--creme); border-left: 2px solid var(--tinta); display: none; flex-direction: column; box-shadow: -6px 0 0 rgba(21,20,19,.08); }
  .chatbot.on { display: flex; }
  .chatbot header { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; border-bottom: 2px solid var(--tinta); }
  .chatbot header b { font-size: 17px; font-weight: 800; letter-spacing: -.02em; display: block; }
  .chatbot header small { font-size: 12px; font-weight: 600; opacity: .6; }
  .chatbot header button { font-size: 26px; line-height: 1; background: none; border: 0; cursor: pointer; color: var(--tinta); }
  .chatbot .aviso { margin: 12px 14px 0; padding: 10px 12px; font-size: 13px; font-weight: 600; background: #FFE7DF; border: 1.5px solid var(--laranja); border-radius: 12px; }
  .chatbot .msgs { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .chatbot .m { max-width: 85%; padding: 9px 13px; border-radius: 16px; font-size: 14px; font-weight: 500; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
  .chatbot .m.bot { align-self: flex-start; background: #fff; border: 1.5px solid var(--tinta); border-bottom-left-radius: 4px; }
  .chatbot .m.eu { align-self: flex-end; background: var(--tinta); color: var(--creme); border-bottom-right-radius: 4px; }
  .chatbot .m.erro { align-self: center; background: #FFE7DF; color: #8a2d14; font-size: 13px; }
  .chatbot .m.dig { opacity: .5; font-style: italic; }
  .chatbot form { display: flex; gap: 8px; padding: 12px 14px 16px; border-top: 2px solid var(--tinta); }
  .chatbot input { flex: 1; font: 600 14px Inter, sans-serif; padding: 11px 14px; border: 2px solid var(--tinta); border-radius: 999px; background: #FFFBF4; outline: none; }
  .chatbot form button { font: 700 13px Inter, sans-serif; background: var(--tinta); color: var(--creme); border: 0; border-radius: 999px; padding: 0 16px; cursor: pointer; }
  .chatbot input:disabled, .chatbot form button:disabled { opacity: .4; cursor: not-allowed; }
  .online { position: fixed; top: 76px; left: 22px; z-index: 3; font-size: 12px; font-weight: 600; opacity: .6; }
  .online.on { opacity: 1; color: var(--tinta); }
  .online.on::first-letter { color: #2ECC71; }
  .chat { position: fixed; left: 50%; bottom: 128px; transform: translateX(-50%); z-index: 5; display: none; }
  .chat.on { display: block; }
  .chat input { width: min(520px, 86vw); font: 600 14px Inter, sans-serif; color: var(--tinta); background: #FFFBF4; border: 2px solid var(--tinta); border-radius: 999px; padding: 11px 18px; outline: none; box-shadow: 0 3px 0 rgba(21,20,19,.2); }
  .entrada { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(237,229,216,.72); backdrop-filter: blur(6px); }
  .entrada .cartao { width: min(380px, 88vw); background: var(--creme); border: 2px solid var(--tinta); border-radius: 22px; padding: 26px 26px 22px; box-shadow: 0 6px 0 rgba(21,20,19,.2); }
  .entrada .logo { font-weight: 800; font-size: 22px; letter-spacing: -0.045em; }
  .entrada .logo span { color: var(--laranja); }
  .entrada h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin: 14px 0 16px; }
  .entrada label, .entrada .rotulo { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; }
  .entrada input { display: block; width: 100%; box-sizing: border-box; margin-top: 6px; margin-bottom: 16px; font: 600 15px Inter, sans-serif; border: 2px solid var(--tinta); border-radius: 12px; padding: 10px 12px; background: #FFFBF4; outline: none; }
  .entrada .visuais { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 18px; }
  .entrada .visuais button { aspect-ratio: 1; border-radius: 14px; border: 2px solid transparent; background: #EDE5D8; cursor: pointer; display: grid; place-items: center; padding: 0; }
  .entrada .visuais button.sel { border-color: var(--tinta); background: #fff; }
  .entrada .visuais i { width: 26px; height: 34px; border-radius: 13px 13px 6px 6px; background: linear-gradient(var(--cabelo) 0 28%, var(--pele) 28% 55%, var(--camisa) 55%); }
  .entrada .entrar { width: 100%; font: 700 15px Inter, sans-serif; color: var(--creme); background: var(--tinta); border: 0; border-radius: 999px; padding: 13px; cursor: pointer; }
  .entrada .entrar:hover { background: var(--laranja); color: var(--tinta); }
  @keyframes entra { from { transform: translateY(-4px) scale(.6); opacity: 0; } }
  @media (max-width: 640px) { .ajuda { display: none; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div class="marca">CREM<span>✱</span>N<small>escritório</small></div>
<div class="ajuda">WASD ou clique para andar (toque duplo corre) · E interage · clique num funcionário para conversar · F senta · Enter conversa · roda do mouse aproxima</div>
<div id="palco"></div>
<div id="dica"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
